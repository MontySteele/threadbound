# Render blueprint (S6.2 — platform ruled: Starter tier + a small persistent
# disk at /data, free *.onrender.com subdomain for the soft release).
# Deploys are git-push: Render rebuilds the Docker image and restarts; the
# server snapshots rooms to PERSIST on SIGTERM and restores on boot, so a
# deploy costs players one refresh (sign-off gate 9 verifies this live).

services:
  - type: web
    name: threadbound
    runtime: docker
    plan: starter
    healthCheckPath: /
    disk:
      name: threadbound-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HUMAN_TELEMETRY
        value: /data/telemetry
      - key: TB_FEEDBACK_DIR
        value: /data/feedback
      - key: PERSIST
        value: /data/threadbound-rooms.json
      - key: TB_MAX_ROOMS
        value: "200"
      - key: TB_ROOM_RATE
        value: "10"
      # review fix: Render fronts the service with exactly one trusted proxy —
      # the rate limiter reads the RIGHTMOST X-Forwarded-For hop (the one
      # Render appended); client-forged hops can't mint fresh buckets
      - key: TB_TRUSTED_PROXY
        value: proxy
      # playtest config (S7/S8): rites + narrative tracks ON for the friend
      # sessions — a solo tester on the hosted build reported "no death-rite
      # screen" because these were unset (rites default off; the engine skips
      # the phase entirely). Remove both to return to the flag-off baseline.
      - key: TB_RITES
        value: "1"
      - key: TB_TRACKS
        value: "1"
      # S11.8 knotwork braid ON for the playtest build only — gate 5 (solo
      # manual pass) rides the playtest. The flag-off public/default path is
      # untouched; TB_KNOTWORK stays default-off per the OQ#59 ruling. Remove
      # to fall back to the lane generator.
      - key: TB_KNOTWORK
        value: "1"
      # maintenance window: set TB_DRAIN=1 in the dashboard, save, and the
      # title screen shows "the loom is being restrung"; unset to reopen
